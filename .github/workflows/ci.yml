name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.4']   # minimum supported and the version production runs
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: none
      - name: Lint all PHP files
        run: |
          status=0
          while IFS= read -r -d '' f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; status=1; }
          done < <(find . -name '*.php' -not -path './vendor/*' -not -path './node_modules/*' -print0)
          exit $status

  phpcs:
    name: PHPCS (WordPress-Extra, PHP 7.4+ compatibility)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2, cs2pr
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run PHPCS
        # Errors fail the build. Warnings (interpolated table names, see phpcs.xml.dist) are shown as annotations.
        run: vendor/bin/phpcs -q --report=checkstyle --runtime-set ignore_warnings_on_exit 1 | cs2pr --graceful-warnings

  secrets:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --redact --no-banner -v

  integration:
    name: Build + integration and upgrade tests (WordPress, MariaDB, Mailpit)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # upgrade test builds the previous release from tag v1.1.0
          fetch-tags: true
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start dev stack
        run: |
          podman --version
          dev/up.sh
      - name: Integration tests
        run: dev/tests/run.sh
      - name: Upgrade test from v1.1.0
        run: dev/tests/upgrade.sh
      - name: Logs on failure
        if: failure()
        run: |
          dev/wp.sh eval 'echo @file_get_contents(WP_CONTENT_DIR . "/debug.log");' || true
          podman logs task-table-dev-wp 2>&1 | tail -100 || true

  plugin-zip:
    name: Plugin zip
    runs-on: ubuntu-24.04
    needs: [php-lint, phpcs, integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run plugin-zip
      - uses: actions/upload-artifact@v4
        with:
          name: task-table-${{ github.sha }}
          path: task-table.zip
          retention-days: 14
