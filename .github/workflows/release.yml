name: Release

# Pushing a tag like v1.3.0 publishes a GitHub release with task-table-1.3.0.zip.
# Before tagging: bump the version in task-table.php, readme.txt and package.json, add the
# CHANGELOG.md and readme.txt entries, merge to main, and run dev/release-check.sh 1.3.0.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    name: Release check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main. Merge first, then tag."; exit 1; }
      - name: Versions and changelog match the tag
        run: dev/release-check.sh "$GITHUB_REF_NAME"

  ci:
    name: CI
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@v7
      # The exact zip that CI built and tested on this commit.
      - uses: actions/download-artifact@v8
        with:
          name: task-table-${{ github.sha }}
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          ZIP="task-table-$V.zip"
          mv task-table.zip "$ZIP"
          {
            dev/release-check.sh "$V"
            printf "\n**Install:** download \`%s\` below and upload it under Plugins → Add New → Upload Plugin.\n" "$ZIP"
          } > notes.md
          PRE=""; case "$V" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$ZIP" --verify-tag --title "$V" --notes-file notes.md $PRE
