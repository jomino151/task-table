name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security problems, use private vulnerability reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: WordPress and PHP version
      placeholder: "WordPress 6.8, PHP 8.3"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally against the local stack (`dev/up.sh`).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: PHP log or browser console output
      render: text
